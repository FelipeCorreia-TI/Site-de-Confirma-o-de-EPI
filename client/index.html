<!DOCTYPE html>
<html lang="PT_BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Retirada de EPI - Almoxerifado</title>
        <link rel="stylesheet" href="css/estilo.css">
        <link rel="manifest" href="manifest.json">
        <link rel="shortcut icon" href="cpl_icon.ico" type="image/x-icon">
    </head>
    <body>

        <div id="caixa-principal">

            <div class="faixa-topo-azul">
                <h2>Controle de Retirada de EPI - CPFL</h2>
                <img src="assets/logos/Logo_CPFL_Energia.png" alt="Logo-CPFL" class="logo-topo">
            </div>

            <form id="formulario-epi">
                <label for="nome-funcionario">Nome completo do Funcionário:</label>
                <input type="text" id="nome-funcionario" required placeholder="Ex: Matheus Cavalcante Sampaio">

                <label for="base-operacional">Qual a sua base operacional?</label>
                <select id="base-operacional" required>
                    <option value="">Selecione uma base operacional...</option>
                    <option value="Base Piracicaba">Base Piracicaba</option>
                    <option value="Base Sumaré">Base Sumaré</option>
                    <option value="Base Americana">Base Americana</option>
                    <option value="LT Piracicaba">LT Piracicaba</option>
                </select>


                <label for="busca-epi">Adicionar Equipamento ao Carrinho:</label>
                <input type="text" id="busca-epi" placeholder="Pesquisar EPI..." style="width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

                
                <select id="Lista-epis">
                    <option value="">Carregando equipamentos...</option>
                </select>

                <label>EPIs Selecionados no Carrinho:</label>
                <div id="carrinho-epis">
                    <p class="carrinho-vazio">Nenhum equipamento adicionado.</p>
                </div>

                <label>Assine na área abaixo:</label>
                <canvas id="quadrado-assinatura" width="400" height="150"></canvas>

                <button type="button" id="botão-limpar">Limpar Assinatura</button>
                <button type="submit" id="botão-enviar">Confirmar Retirada</button>
                </form>

                <div class="faixa-rodape-azul"></div>

            </div>
        <script src="js/logica.js"></script>
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('PWA registrado com sucesso'))
                    .catch(erro => console.log('Erro ao registrar PWA:', erro));
            }
        </script>   
    </body>
</html>
